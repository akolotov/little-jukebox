services:
  web:
    image: ${JUKEBOX_IMAGE:?JUKEBOX_IMAGE must be set}
    pull_policy: ${JUKEBOX_PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      JUKEBOX_BASE_PATH: ${JUKEBOX_BASE_PATH:?JUKEBOX_BASE_PATH must be set}
    volumes:
      - ./data:/data:ro
      - ./cache/thumbnails:/var/cache/nginx/thumbnails
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      tailscale-ingress:
        aliases:
          - ${JUKEBOX_DOCKER_ALIAS:?JUKEBOX_DOCKER_ALIAS must be set}

networks:
  tailscale-ingress:
    external: true
    name: tailscale-ingress
