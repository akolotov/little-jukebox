<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Jukebox</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #121212; color: #fff; font-family: Arial, sans-serif;
      overscroll-behavior: none; touch-action: pan-x;
    }
    button { font: inherit; }
    main {
      width: 100%; height: 100vh; max-width: 1180px; margin: 0 auto;
      padding: 8vh clamp(18px, 3.5vw, 42px) 15vh;
    }
    #player {
      display: flex; height: 100%; min-height: 0; flex-direction: column;
      align-items: center; gap: clamp(8px, 1.25vh, 24px); text-align: center;
    }
    #catalog-status {
      position: fixed; top: 2vh; left: 50%; z-index: 20; display: none;
      max-width: 90vw; margin: 0; padding: 10px 18px; transform: translateX(-50%);
      border-radius: 10px; background: #6e1d1d; box-shadow: 0 4px 16px rgba(0,0,0,.45);
      font-size: clamp(15px, 2vw, 20px);
    }
    #catalog-status.error { display: block; }
    #hero-toggle {
      position: relative; display: block; width: 100%; max-height: 38vh;
      aspect-ratio: 16 / 9; flex: 0 1 auto; padding: 0; overflow: hidden;
      border: 4px solid #343434; border-radius: clamp(14px, 2.2vw, 24px);
      background: #242424; color: #fff; cursor: pointer; touch-action: manipulation;
    }
    #hero-toggle:focus, .playback-control:focus, .track:focus {
      outline: 5px solid #fff; outline-offset: 4px;
    }
    #hero-cover { display: block; width: 100%; height: 100%; object-fit: cover; }
    #hero-toggle.missing-cover::after {
      content: "\266B"; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #777; font-size: min(22vw, 220px);
    }
    #now-playing { width: 100%; min-height: 0; flex: 0 0 auto; }
    #track-title {
      margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: clamp(28px, 5vw, 52px); line-height: 1.08;
    }
    #progress-area {
      display: flex; width: 100%; flex: 0 0 auto; align-items: center;
      gap: clamp(10px, 2vw, 20px); color: #d2d2d2;
      font-size: clamp(15px, 2.3vw, 23px); font-variant-numeric: tabular-nums;
    }
    #progress-track {
      height: 7px; min-width: 0; flex: 1; overflow: hidden;
      border-radius: 999px; background: #444;
    }
    #progress-value { width: 0; height: 100%; border-radius: inherit; background: #2d7ff9; }
    #playback-controls {
      display: flex; width: min(82%, 760px); flex: 0 0 auto;
      align-items: center; justify-content: space-between;
      margin-top: clamp(24px, 4.5vh, 54px);
    }
    .playback-control {
      display: flex; width: clamp(82px, 15vw, 142px); height: clamp(82px, 15vw, 142px);
      align-items: center; justify-content: center; padding: 0;
      border: 3px solid rgba(255,255,255,.72); border-radius: 50%;
      background: #262626; color: #fff; cursor: pointer; touch-action: manipulation;
    }
    .playback-control.primary {
      width: clamp(102px, 18vw, 170px); height: clamp(102px, 18vw, 170px); border-width: 4px;
    }
    .playback-control.active {
      border-color: #75aaff; background: #2d7ff9; box-shadow: 0 0 22px rgba(45,127,249,.8);
    }
    .playback-control:disabled { cursor: default; opacity: .32; }
    .playback-control svg { width: 56%; height: 56%; }
    .icon-hidden { display: none; }
    #playlist {
      width: 100%; min-height: 0; margin-top: clamp(20px, 3.5vh, 42px);
      flex: 0 0 auto;
    }
    #gallery {
      --card-width: 30%; display: flex; width: 100%; min-height: 0; gap: 2.5%;
      padding: 6px 0 12px;
      overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x;
    }
    #gallery::before, #gallery::after {
      content: "";
      flex: 0 0 calc((100% - var(--card-width)) / 2 - 2.5%);
    }
    #gallery::-webkit-scrollbar { display: none; }
    .track {
      display: block; width: var(--card-width); min-width: var(--card-width);
      flex: 0 0 var(--card-width); padding: 0; overflow: hidden;
      scroll-snap-align: center; border: 4px solid #343434;
      border-radius: clamp(10px, 1.5vw, 17px); background: #242424;
      color: #fff; cursor: pointer; touch-action: manipulation;
    }
    .track.selected { border-color: #2d7ff9; box-shadow: 0 0 15px rgba(45,127,249,.82); }
    .track img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #333;
    }
    .track img.missing-cover { visibility: hidden; }
    .track-title {
      display: block; padding: clamp(7px, 1vh, 12px) 7px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      font-size: clamp(15px, 2.4vw, 24px); font-weight: bold;
    }
    @media (max-height: 900px) {
      main { padding-top: 6vh; padding-bottom: 15vh; }
      #player { gap: 6px; }
      #hero-toggle { max-height: 34vh; }
      #playback-controls { margin-top: 18px; }
      #playlist { margin-top: 16px; }
      .playback-control { width: 72px; height: 72px; }
      .playback-control.primary { width: 88px; height: 88px; }
    }
  </style>
</head>
<body>
  <main>
    <div id="player">
      <p id="catalog-status" role="status" aria-live="polite"></p>
      <button id="hero-toggle" type="button" aria-label="Play selected song">
        <img id="hero-cover" alt="">
      </button>
      <section id="now-playing" aria-live="polite">
        <h1 id="track-title">Little Jukebox</h1>
      </section>
      <div id="progress-area">
        <span id="elapsed-time">0:00</span>
        <div id="progress-track" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div id="progress-value"></div>
        </div>
        <span id="duration-time">--:--</span>
      </div>
      <div id="playback-controls" aria-label="Playback controls">
        <button id="repeat-playlist" class="playback-control" type="button" aria-pressed="false" aria-label="Repeat the playlist" title="Repeat the playlist">
          <svg viewBox="0 0 96 96" aria-hidden="true"><path d="M24 35h38m0 0-9-9m9 9-9 9M72 61H34m0 0 9-9m-9 9 9 9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/></svg>
        </button>
        <button id="play-pause" class="playback-control primary" type="button" aria-label="Play selected song" title="Play selected song">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <path id="play-icon" d="M31 20v56l45-28z" fill="currentColor"/>
            <g id="pause-icon" class="icon-hidden"><rect x="25" y="19" width="17" height="58" rx="4" fill="currentColor"/><rect x="54" y="19" width="17" height="58" rx="4" fill="currentColor"/></g>
          </svg>
        </button>
        <button id="next-track" class="playback-control" type="button" aria-label="Play the next song" title="Play the next song">
          <svg viewBox="0 0 96 96" aria-hidden="true"><path d="M20 22v52l38-26zM64 22h10v52H64z" fill="currentColor"/></svg>
        </button>
      </div>
      <section id="playlist" aria-label="Playlist"><div id="gallery"></div></section>
      <audio id="audio" preload="metadata"></audio>
    </div>
  </main>

  <script>
    (function () {
      var audio = document.getElementById('audio');
      var gallery = document.getElementById('gallery');
      var catalogStatus = document.getElementById('catalog-status');
      var heroToggle = document.getElementById('hero-toggle');
      var heroCover = document.getElementById('hero-cover');
      var trackTitle = document.getElementById('track-title');
      var progressTrack = document.getElementById('progress-track');
      var progressValue = document.getElementById('progress-value');
      var elapsedTime = document.getElementById('elapsed-time');
      var durationTime = document.getElementById('duration-time');
      var repeatButton = document.getElementById('repeat-playlist');
      var playPauseButton = document.getElementById('play-pause');
      var nextButton = document.getElementById('next-track');
      var playIcon = document.getElementById('play-icon');
      var pauseIcon = document.getElementById('pause-icon');
      var catalogTracks = [];
      var catalogSignature = '';
      var catalogRequestInProgress = false;
      var selectedTrack = null;
      var selectedTile = null;
      var loadedTrackId = null;
      var isStarting = false;
      var repeatPlaylistEnabled = false;
      var playerStatus = 'loading';
      var pendingSeek = null;
      var lastSavedSecond = -1;
      var restoredState = null;
      var controlsStorageKey = 'little-jukebox-playback-controls';
      var playbackStorageKey = 'little-jukebox-playback-state';

      function setCatalogStatus(message, isError) {
        catalogStatus.className = isError ? 'error' : '';
        catalogStatus.innerHTML = '';
        catalogStatus.appendChild(document.createTextNode(message));
      }

      function isFiniteNumber(value) {
        return typeof value === 'number' && isFinite(value);
      }

      function formatTime(value) {
        var seconds;
        var minutes;
        if (!isFiniteNumber(value) || value < 0) { return '--:--'; }
        seconds = Math.floor(value);
        minutes = Math.floor(seconds / 60);
        seconds %= 60;
        return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
      }

      function getTrackIndex(track) {
        var index;
        if (!track) { return -1; }
        for (index = 0; index < catalogTracks.length; index += 1) {
          if (catalogTracks[index].id === track.id) { return index; }
        }
        return -1;
      }

      function getTile(index) {
        return gallery.getElementsByTagName('button')[index] || null;
      }

      function centerTile(tile, animate) {
        var galleryBounds;
        var tileBounds;
        var target;
        var maximum;
        if (!tile) { return; }
        galleryBounds = gallery.getBoundingClientRect();
        tileBounds = tile.getBoundingClientRect();
        target = gallery.scrollLeft + tileBounds.left - galleryBounds.left -
          (gallery.clientWidth - tile.offsetWidth) / 2;
        maximum = gallery.scrollWidth - gallery.clientWidth;
        target = Math.max(0, Math.min(target, maximum));
        if (animate && typeof gallery.scrollTo === 'function') {
          try {
            gallery.scrollTo({ left: target, behavior: 'smooth' });
            return;
          } catch (error) {
            // Fall through for browsers without object-form scrollTo support.
          }
        }
        gallery.scrollLeft = target;
      }

      function setSelectedTile(tile, animate) {
        var tiles = gallery.getElementsByTagName('button');
        var index;
        for (index = 0; index < tiles.length; index += 1) {
          tiles[index].className = 'track';
          tiles[index].setAttribute('aria-pressed', 'false');
        }
        selectedTile = tile;
        if (selectedTile) {
          selectedTile.className = 'track selected';
          selectedTile.setAttribute('aria-pressed', 'true');
          window.setTimeout(function () { centerTile(selectedTile, animate); }, 0);
        }
      }

      function updateProgress() {
        var current = isFiniteNumber(audio.currentTime) ? audio.currentTime : 0;
        var duration = isFiniteNumber(audio.duration) ? audio.duration : 0;
        var percentage = duration > 0 ? Math.min(100, Math.max(0, current / duration * 100)) : 0;
        elapsedTime.innerHTML = formatTime(current);
        durationTime.innerHTML = duration > 0 ? formatTime(duration) : '--:--';
        progressValue.style.width = percentage + '%';
        progressTrack.setAttribute('aria-valuemax', duration > 0 ? String(Math.floor(duration)) : '0');
        progressTrack.setAttribute('aria-valuenow', String(Math.floor(current)));
      }

      function updateInterface() {
        var playing = playerStatus === 'playing' || playerStatus === 'starting';
        var currentIndex = getTrackIndex(selectedTrack);
        var canGoNext = currentIndex !== -1 && (currentIndex < catalogTracks.length - 1 || repeatPlaylistEnabled);
        var actionLabel = playing ? 'Pause selected song' : 'Play selected song';
        trackTitle.innerHTML = '';
        trackTitle.appendChild(document.createTextNode(selectedTrack ? selectedTrack.title : 'Little Jukebox'));
        playIcon.setAttribute('class', playing ? 'icon-hidden' : '');
        pauseIcon.setAttribute('class', playing ? '' : 'icon-hidden');
        playPauseButton.setAttribute('aria-label', actionLabel);
        playPauseButton.title = actionLabel;
        playPauseButton.disabled = !selectedTrack;
        heroToggle.setAttribute('aria-label', actionLabel);
        heroToggle.title = actionLabel;
        heroToggle.disabled = !selectedTrack;
        repeatButton.className = 'playback-control' + (repeatPlaylistEnabled ? ' active' : '');
        repeatButton.setAttribute('aria-pressed', repeatPlaylistEnabled ? 'true' : 'false');
        repeatButton.disabled = catalogTracks.length === 0;
        nextButton.disabled = !canGoNext;
        updateProgress();
      }

      function showSelectedCover() {
        heroToggle.className = '';
        heroCover.style.display = selectedTrack ? 'block' : 'none';
        heroCover.alt = selectedTrack ? selectedTrack.title : '';
        if (selectedTrack) { heroCover.src = selectedTrack.cover; }
        else { heroCover.removeAttribute('src'); }
      }

      function saveControlState() {
        try {
          window.localStorage.setItem(controlsStorageKey, JSON.stringify({
            autoAdvance: true,
            repeatPlaylist: repeatPlaylistEnabled
          }));
        } catch (error) {
          // The player continues to work if this browser does not allow storage.
        }
      }

      function savePlaybackState(positionOverride) {
        var savedTime;
        if (!selectedTrack) { return; }
        savedTime = isFiniteNumber(positionOverride) ? positionOverride : audio.currentTime;
        try {
          window.localStorage.setItem(playbackStorageKey, JSON.stringify({
            trackId: selectedTrack.id,
            currentTime: isFiniteNumber(savedTime) ? savedTime : 0
          }));
        } catch (error) {
          // The player continues to work if this browser does not allow storage.
        }
      }

      function restoreStoredState() {
        var savedControls;
        var savedPlayback;
        try {
          savedControls = window.localStorage.getItem(controlsStorageKey);
          if (savedControls) {
            savedControls = JSON.parse(savedControls);
            repeatPlaylistEnabled = savedControls.repeatPlaylist === true;
          }
          savedPlayback = window.localStorage.getItem(playbackStorageKey);
          if (savedPlayback) {
            savedPlayback = JSON.parse(savedPlayback);
            if (typeof savedPlayback.trackId === 'string') {
              restoredState = {
                trackId: savedPlayback.trackId,
                currentTime: isFiniteNumber(savedPlayback.currentTime) && savedPlayback.currentTime > 0 ? savedPlayback.currentTime : 0
              };
            }
          }
        } catch (error) {
          restoredState = null;
        }
      }

      function loadSelectedAudio(seekTime) {
        if (!selectedTrack) { return; }
        pendingSeek = isFiniteNumber(seekTime) && seekTime > 0 ? seekTime : 0;
        loadedTrackId = selectedTrack.id;
        audio.src = selectedTrack.audio;
        audio.load();
      }

      function selectTrack(track, tile, animate, seekTime) {
        selectedTrack = track;
        playerStatus = 'paused';
        isStarting = false;
        setSelectedTile(tile, animate);
        showSelectedCover();
        loadSelectedAudio(seekTime || 0);
        updateInterface();
        savePlaybackState(seekTime || 0);
      }

      function playSelected(restart) {
        var requestedId;
        var playback;
        if (!selectedTrack) { return; }
        if (restart || loadedTrackId !== selectedTrack.id) { loadSelectedAudio(0); }
        else if (audio.ended) { audio.currentTime = 0; }
        requestedId = selectedTrack.id;
        isStarting = true;
        playerStatus = 'starting';
        setSelectedTile(selectedTile, true);
        updateInterface();
        playback = audio.play();
        if (playback && typeof playback.catch === 'function') {
          playback.catch(function () {
            if (selectedTrack && selectedTrack.id === requestedId && isStarting) {
              isStarting = false;
              playerStatus = 'error';
              updateInterface();
              savePlaybackState();
            }
          });
        }
      }

      function pauseSelected() {
        isStarting = false;
        audio.pause();
        playerStatus = 'paused';
        setSelectedTile(selectedTile, true);
        updateInterface();
        savePlaybackState();
      }

      function toggleSelected() {
        if (!selectedTrack) { return; }
        if (playerStatus === 'playing' || playerStatus === 'starting') { pauseSelected(); }
        else { playSelected(false); }
      }

      function playTrackAtIndex(index) {
        if (index < 0 || index >= catalogTracks.length) { return false; }
        selectTrack(catalogTracks[index], getTile(index), true, 0);
        playSelected(false);
        return true;
      }

      function playNextTrack() {
        var currentIndex = getTrackIndex(selectedTrack);
        if (currentIndex === -1) { return false; }
        if (currentIndex < catalogTracks.length - 1) { return playTrackAtIndex(currentIndex + 1); }
        if (repeatPlaylistEnabled && catalogTracks.length) { return playTrackAtIndex(0); }
        return false;
      }

      function addTrack(track) {
        var tile = document.createElement('button');
        var cover = document.createElement('img');
        var title = document.createElement('span');
        tile.type = 'button';
        tile.className = 'track';
        tile.setAttribute('aria-pressed', 'false');
        tile.setAttribute('aria-label', 'Play or pause ' + track.title);
        tile.title = 'Play or pause ' + track.title;
        cover.src = track.cover;
        cover.alt = '';
        cover.onerror = function () { cover.className = 'missing-cover'; };
        title.className = 'track-title';
        title.appendChild(document.createTextNode(track.title));
        tile.appendChild(cover);
        tile.appendChild(title);
        tile.onclick = function () {
          if (selectedTrack && selectedTrack.id === track.id) {
            setSelectedTile(tile, true);
            toggleSelected();
          } else {
            selectTrack(track, tile, true, 0);
            playSelected(false);
          }
        };
        gallery.appendChild(tile);
      }

      function renderCatalog(tracks) {
        var previousTrack = selectedTrack;
        var previousAudio = previousTrack ? previousTrack.audio : null;
        var selectedIndex = -1;
        var index;
        catalogTracks = tracks;
        gallery.innerHTML = '';
        for (index = 0; index < catalogTracks.length; index += 1) {
          addTrack(catalogTracks[index]);
          if (previousTrack && catalogTracks[index].id === previousTrack.id) { selectedIndex = index; }
        }
        if (!catalogTracks.length) {
          audio.pause();
          audio.removeAttribute('src');
          selectedTrack = null;
          selectedTile = null;
          loadedTrackId = null;
          playerStatus = 'paused';
          showSelectedCover();
          updateInterface();
          return;
        }
        if (selectedIndex !== -1 && catalogTracks[selectedIndex].audio === previousAudio) {
          selectedTrack = catalogTracks[selectedIndex];
          setSelectedTile(getTile(selectedIndex), true);
          showSelectedCover();
          updateInterface();
          return;
        }
        if (!previousTrack && restoredState) {
          for (index = 0; index < catalogTracks.length; index += 1) {
            if (catalogTracks[index].id === restoredState.trackId) { selectedIndex = index; break; }
          }
        }
        if (selectedIndex === -1) { selectedIndex = 0; }
        audio.pause();
        selectTrack(
          catalogTracks[selectedIndex],
          getTile(selectedIndex),
          false,
          !previousTrack && restoredState && catalogTracks[selectedIndex].id === restoredState.trackId ? restoredState.currentTime : 0
        );
        restoredState = null;
      }

      function isUsableTrack(track) {
        return track && typeof track.id === 'string' && typeof track.title === 'string' &&
          typeof track.cover === 'string' && typeof track.audio === 'string';
      }

      function loadCatalog() {
        var request = new XMLHttpRequest();
        if (catalogRequestInProgress) { return; }
        catalogRequestInProgress = true;
        request.open('GET', 'catalog.json?updated=' + new Date().getTime(), true);
        request.timeout = 10000;
        request.onreadystatechange = function () {
          var catalog;
          var tracks;
          var signature;
          var index;
          if (request.readyState !== 4) { return; }
          catalogRequestInProgress = false;
          if (request.status < 200 || request.status >= 300) {
            setCatalogStatus('The playlist could not be loaded. The current playlist is unchanged.', true);
            return;
          }
          try { catalog = JSON.parse(request.responseText); }
          catch (error) {
            setCatalogStatus('The playlist data is invalid. The current playlist is unchanged.', true);
            return;
          }
          if (!catalog.tracks || Object.prototype.toString.call(catalog.tracks) !== '[object Array]') {
            setCatalogStatus('The playlist data is invalid. The current playlist is unchanged.', true);
            return;
          }
          tracks = [];
          for (index = 0; index < catalog.tracks.length; index += 1) {
            if (isUsableTrack(catalog.tracks[index])) { tracks.push(catalog.tracks[index]); }
          }
          signature = JSON.stringify(tracks);
          if (signature !== catalogSignature) {
            renderCatalog(tracks);
            catalogSignature = signature;
          }
          setCatalogStatus('', false);
        };
        request.ontimeout = function () {
          catalogRequestInProgress = false;
          setCatalogStatus('The playlist request timed out. The current playlist is unchanged.', true);
        };
        request.onerror = function () {
          catalogRequestInProgress = false;
          setCatalogStatus('The playlist could not be loaded. The current playlist is unchanged.', true);
        };
        request.send();
      }

      heroCover.onerror = function () {
        heroCover.style.display = 'none';
        heroToggle.className = 'missing-cover';
      };
      heroToggle.onclick = toggleSelected;
      playPauseButton.onclick = toggleSelected;
      repeatButton.onclick = function () {
        repeatPlaylistEnabled = !repeatPlaylistEnabled;
        setSelectedTile(selectedTile, true);
        updateInterface();
        saveControlState();
      };
      nextButton.onclick = playNextTrack;

      audio.onloadedmetadata = function () {
        if (pendingSeek !== null) {
          if (isFiniteNumber(audio.duration) && pendingSeek < audio.duration) {
            try { audio.currentTime = pendingSeek; }
            catch (error) { /* Some appliance browsers do not allow seeking until later. */ }
          }
          pendingSeek = null;
        }
        updateProgress();
      };
      audio.ondurationchange = updateProgress;
      audio.ontimeupdate = function () {
        var currentSecond = Math.floor(audio.currentTime || 0);
        updateProgress();
        if (currentSecond !== lastSavedSecond && currentSecond % 3 === 0) {
          lastSavedSecond = currentSecond;
          savePlaybackState();
        }
      };
      audio.onplaying = function () {
        isStarting = false;
        playerStatus = 'playing';
        updateInterface();
      };
      audio.onpause = function () {
        if (!audio.ended && !isStarting && selectedTrack) {
          playerStatus = 'paused';
          updateInterface();
        }
      };
      audio.onended = function () {
        isStarting = false;
        if (playNextTrack()) { return; }
        try { audio.currentTime = 0; }
        catch (error) { /* The next user gesture can still restart the audio. */ }
        playerStatus = 'paused';
        updateInterface();
        savePlaybackState();
      };
      audio.onerror = function () {
        if (selectedTrack) {
          isStarting = false;
          playerStatus = 'error';
          updateInterface();
        }
      };

      window.addEventListener('pagehide', savePlaybackState);
      window.addEventListener('focus', loadCatalog);
      window.addEventListener('pageshow', loadCatalog);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { savePlaybackState(); }
        else { loadCatalog(); }
      });
      restoreStoredState();
      updateInterface();
      loadCatalog();
      window.setInterval(loadCatalog, 30000);
    }());
  </script>
</body>
</html>
